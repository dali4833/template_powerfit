<div class="favorites-container">
    <h2 class="favorites-title">My Favorite Recipes</h2>
  
    <div *ngIf="isLoading" class="loading-message">
      Loading your recipes...
    </div>
  
    <div *ngIf="!isLoading && favoriteRecipes.length === 0" class="empty-message">
      No favorite recipes saved yet
    </div>
  
    <div *ngIf="!isLoading && favoriteRecipes.length > 0" class="scrollable-list-container">
      <div class="favorites-list">
        <div *ngFor="let fav of favoriteRecipes" class="recipe-card floating-card">
          <div class="recipe-header">
            <h3>{{fav.recipe.name}}</h3>
            <span class="recipe-type">{{fav.user.user_type.toLowerCase()}}</span>
          </div>
          <p class="recipe-description">{{fav.recipe.description}}</p>
          <div class="recipe-calories">{{fav.recipe.calories}} kcal</div>
          <div class="recipe-instructions">
            <h4>Instructions:</h4>
            <p>{{fav.recipe.instructions}}</p>
          </div>
          <div class="recipe-footer">
            <span class="recipe-author">By {{fav.user.name}}</span>
            <button class="remove-btn" (click)="removeFavorite(fav.id)">
              Remove
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
