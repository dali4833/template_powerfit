<div class="container py-4">
    <h2 class="mb-4 text-primary">Diet Program Management</h2>
  
    <!-- Form -->
    <form (ngSubmit)="updateDietProgram()" #form="ngForm" class="card p-4 shadow-sm mb-4">
        <input type="hidden" [(ngModel)]="newDietProgram.idDiet" name="idDiet" />
      
        <div class="row g-3">
          <div class="col-md-6">
            <label for="name" class="form-label">Program Name</label>
            <input
              type="text"
              id="name"
              class="form-control"
              [(ngModel)]="newDietProgram.name"
              name="name"
              placeholder="Enter program name"
              required
            />
            <div class="col-md-6">
                <label for="idDiet" class="form-label">ID (debug)</label>
                <input type="text" id="idDiet" class="form-control" [(ngModel)]="newDietProgram.idDiet" name="idDiet" disabled>
              </div>
              
          </div>
      
          <div class="col-md-6">
            <label for="description" class="form-label">Description</label>
            <input
              type="text"
              id="description"
              class="form-control"
              [(ngModel)]="newDietProgram.description"
              name="description"
              placeholder="Enter description"
              required
            />
          </div>
      
          <div class="col-md-4">
            <label for="calories" class="form-label">Calories</label>
            <input
              type="number"
              id="calories"
              class="form-control"
              [(ngModel)]="newDietProgram.calories"
              name="calories"
              placeholder="e.g. 2000"
              required
            />
          </div>
      
          <div class="col-md-4">
            <label for="duration" class="form-label">Duration (days)</label>
            <input
              type="number"
              id="duration"
              class="form-control"
              [(ngModel)]="newDietProgram.duration"
              name="duration"
              placeholder="e.g. 30"
              required
            />
          </div>
      
          <div class="col-md-4 d-flex align-items-end">
            <button type="submit" class="btn btn-primary w-100">
              <i class="bi bi-arrow-repeat me-2"></i>Update Program
            </button>
          </div>
        </div>
      </form>
      
  
    <!-- Table of diet programs -->
    <div class="table-responsive">
      <table class="table table-bordered table-hover shadow-sm">
        <thead class="table-light">
          <tr>
           
            <th>Name</th>
            <th>Description</th>
            <th>Calories</th>
            <th>Duration</th>
            <th>Creation Date</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let diet of dietPrograms">
            
            <td>{{ diet.name }}</td>
            <td>{{ diet.description }}</td>
            <td>{{ diet.calories }}</td>
            <td>{{ diet.duration }} days</td>
            <td>{{ diet.creationDate || 'N/A' }}</td>
            <td>
              <button class="btn btn-sm btn-primary me-2" (click)="selectDietProgramForEdit(diet)">Edit</button>
              <button class="btn btn-sm btn-danger" (click)="deleteDietProgram(diet.idDiet)">Delete</button>
            </td>
          </tr>
          <tr *ngIf="dietPrograms.length === 0">
            <td colspan="7" class="text-center text-muted">No diet programs found.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
