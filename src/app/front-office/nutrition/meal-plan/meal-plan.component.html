<div class="container mt-5">
  <h2 class="text-center mb-4 text-primary">Meal Plans</h2>

  <!-- Alert feedback -->
  <div *ngIf="successMessage" class="alert alert-success" role="alert">{{ successMessage }}</div>
  <div *ngIf="errorMessage" class="alert alert-danger" role="alert">{{ errorMessage }}</div>

  <!-- Form -->
  <form (ngSubmit)="addMealPlan()" class="bg-white p-4 rounded shadow border">
    <div class="row">
      <div class="col-md-6 mb-3">
        <label for="dayOfWeek" class="form-label">Day of the Week</label>
        <input type="text" id="dayOfWeek" class="form-control" [(ngModel)]="newMeal.dayOfWeek" name="dayOfWeek" placeholder="e.g., 15 " required />
      </div>
      <div class="col-md-6 mb-3">
        <label for="description" class="form-label">Description</label>
        <input type="text" id="description" class="form-control" [(ngModel)]="newMeal.description" name="description" placeholder="Enter description" required />
      </div>
      <div class="col-md-6 mb-3">
        <label for="userId" class="form-label">User ID</label>
        <input type="number" id="userId" class="form-control" [(ngModel)]="newMeal.userId" name="userId" required min="1" />
      </div>
      <div class="col-md-6 mb-3">
        <label for="dietProgram" class="form-label">Diet Program</label>
        <select id="dietProgram" class="form-select" [(ngModel)]="newMeal.dietProgramId" name="dietProgramId">
          <option value="" disabled selected>Select Diet Program</option>
          <option *ngFor="let program of dietPrograms" [value]="program.idDiet">{{ program.name }}</option>
        </select>
      </div>
      <div class="col-12 mb-3">
        <label for="recipe" class="form-label">Recipe</label>
        <select id="recipe" class="form-select" [(ngModel)]="newMeal.recipe" name="recipeId">
          <option value="" disabled selected>Select Recipe</option>
          <option *ngFor="let recipe of recipes" [value]="recipe.idRecipe">{{ recipe.name }}</option>
        </select>
      </div>
    </div>
    <button type="submit" class="btn btn-primary w-100">
      <i class="bi bi-plus-circle"></i> Add Meal Plan
    </button>
  </form>

  <!-- Table -->
  <div class="table-responsive mt-4">
    <table class="table table-hover align-middle shadow-sm">
      <thead class="table-dark">
        <tr>
          
          <th>Day</th>
          <th>Description</th>
          <th>User ID</th>
          <th>Diet Program</th>
          <th>Recipe</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let meal of mealPlans; let i = index">
          
          <td>{{ meal.dayOfWeek }}</td>
          <td>{{ meal.description }}</td>
          <td>{{ meal.userId }}</td>
          <td>{{ meal.dietProgram?.name || 'N/A' }}</td>
          <td>{{ meal.recipe?.name || 'N/A' }}</td>
          <td>
            <button class="btn btn-outline-primary btn-sm me-2" (click)="editMealPlan(meal)">
              <i class="bi bi-pencil"></i> Modify      
            </button>

            <button class="btn btn-outline-danger btn-sm" (click)="confirmDelete(meal.userId)">
              <i class="bi bi-trash"></i> Delete     
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
