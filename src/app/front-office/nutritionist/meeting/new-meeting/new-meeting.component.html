<div class="form-container">
  <h2> Add New Meeting</h2>

  <form (ngSubmit)="onSubmit()" [formGroup]="meetingForm">
    <div class="form-group">
      <label for="patientName">Patient Name</label>
      <input id="patientName" type="text" formControlName="patientName" (input)="onNameInput($event)" placeholder="e.g. Sarah Ben Youssef" required />
    </div>

    <!-- ✅ Champ DateTime-local pour la date et l'heure -->
    <div class="form-group">
      <label for="date">Date & Time</label>
      <input id="date" type="datetime-local" formControlName="date" required />
    </div>

    <div class="form-group">
      <label for="status">Status</label>
      <select id="status" formControlName="status" required>
        <option value="" disabled selected>Select Status</option>
        <option value="confirmed">Confirmed</option>
        <option value="canceled">Canceled</option>
      </select>
    </div>

    <div class="form-group">
      <label for="notes">Notes</label>
      <textarea id="notes" formControlName="notes" rows="4" placeholder="Add any important notes..."></textarea>
    </div>

    <div class="form-actions">

      <button class="btn-back" routerLink="/nutritionist/meeting">
        ← Back to Meetings
      </button>
      
      <button type="submit" [disabled]="!meetingForm.valid">Add Meeting</button>
      
    </div>
    
  </form>
</div>
