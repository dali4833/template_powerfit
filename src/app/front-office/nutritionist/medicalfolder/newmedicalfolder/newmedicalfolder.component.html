<div class="form-container">
  <h2>Create New Medical Folder</h2>
  <form [formGroup]="patientForm" (ngSubmit)="onSubmit()">

    <div class="form-group">
      <label>Patient Name</label>
    <input type="text" formControlName="patientName" (input)="onNameInput($event)" />
  </div>

    <div class="form-group">
      <label>Birth Date</label>
      <input type="date" formControlName="birthDate" />
    </div>

    <div class="form-group">
      <label>Gender</label>
      <select formControlName="gender">
        <option value="Female">Female</option>
        <option value="Male">Male</option>
      </select>
    </div>

    <div class="form-group">
      <label>Weight (kg)</label>
      <input type="number" formControlName="weight" />
    </div>

    <div class="form-group">
      <label>Height (cm)</label>
      <input type="number" formControlName="height" />
    </div>

    <div class="form-group">
      <label>BMI</label>
      <input type="number" formControlName="bmi" readonly />
    </div>

    <div class="form-group">
      <label>Phone</label>
      <input type="text"
             formControlName="patientPhone"
             maxlength="11" 
             inputmode="numeric"
             (input)="onPhoneInput($event)" />
    </div>
    

    <div class="form-group">
      <label>Email</label>
      <input type="email" formControlName="patientEmail" />
    </div>

    <div class="form-group">
      <label>Allergies</label>
      <input type="text" formControlName="allergies" />
    </div>

    <div class="form-group">
      <label>Medical History</label>
      <textarea formControlName="medicalHistory"></textarea>
    </div>

    <div class="form-group">
      <label>Reason for Visit</label>
      <input type="text" formControlName="reasonForVisit" />
    </div>

    <div class="form-group">
      <label>Notes</label>
      <textarea formControlName="notes"></textarea>
    </div>

    <button type="submit" [disabled]="patientForm.invalid">Create Folder</button>
  </form>
</div>
