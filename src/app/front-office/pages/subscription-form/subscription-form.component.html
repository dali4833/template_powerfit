<div class="uk-container uk-margin-top">
  <h3 class="uk-heading-line uk-text-center"><span>Subscribe to a Pack</span></h3>
  <form (ngSubmit)="onSubmit()" #subscriptionForm="ngForm" class="uk-form-stacked">
    <div class="uk-margin">
      <label class="uk-form-label" for="startDate">Start Date</label>
      <input
        type="date"
        id="startDate"
        class="uk-input"
        [(ngModel)]="subscription.startDate"
        name="startDate"
        required>
    </div>
    <div class="uk-margin">
      <label class="uk-form-label" for="endDate">End Date</label>
      <input
        type="date"
        id="endDate"
        class="uk-input"
        [(ngModel)]="subscription.endDate"
        name="endDate"
        required>
    </div>
    <div class="uk-margin">
      <button
        type="submit"
        class="uk-button uk-button-primary uk-width-1-1"
        [disabled]="!subscriptionForm.valid">
        Confirm Subscription
      </button>
    </div>
  </form>
</div>
