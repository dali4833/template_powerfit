<div class="uk-section uk-section-primary uk-light">
    <div class="uk-container">
        <h1 class="uk-heading-medium">Training Sessions</h1>
    </div>
</div>

<div class="uk-section">
    <div class="uk-container">
        <div class="uk-grid uk-grid-match uk-grid-medium uk-child-width-1-3@m" uk-grid>
            <div class="uk-width-1-3@m" *ngFor="let session of trainingSessions">
                <div class="uk-card uk-card-default">
                    <div class="uk-card-media-top">
                        <img src="assets/images/com_hikashop/upload/thumbnails/450x450f/2.jpg" alt="Training Session">
                    </div>
                    <div class="uk-card-body">
                        <h3 class="uk-card-title">{{session.description}}</h3>
                        <div class="uk-margin-small">
                            <span class="uk-label uk-label-primary">{{session.sport}}</span>
                        </div>
                        <dl class="uk-description-list">
                            <dt><span uk-icon="calendar"></span> Date: {{session.date | date}}</dt>
                            <dt><span uk-icon="clock"></span> Time: {{session.startTime}} - {{session.endTime}}</dt>
                            <dt><span uk-icon="users"></span> Max Participants: {{session.maxParticipants}} spots</dt>
                        </dl>
                    </div>
                    <div class="uk-card-footer uk-padding-remove-horizontal">
                        <!-- Booking Button -->
                        <button 
                            *ngIf="!session.isBooked" 
                            [disabled]="session.maxParticipants <= session.currentParticipants"
                            class="uk-button uk-button-primary uk-width-1-1 mb-1" 
                            (click)="bookSession(session.id)">
                            {{ session.maxParticipants <= session.currentParticipants ? 'Session Full' : 'Book Session' }}
                        </button>

                        <button 
                            *ngIf="session.isBooked" 
                            class="uk-button uk-button-danger uk-width-1-1 mb-1" 
                            (click)="session.bookingId !== undefined && cancelBooking(session.id, session.bookingId)">
                            Cancel Booking
                        </button>

                        <!-- Other Buttons -->
                        <button class="uk-button uk-button-secondary uk-width-1-1 mb-1" 
                            (click)="checkExercises(session.id)">
                            Check Exercises
                        </button>
                        <button class="uk-button uk-button-default uk-width-1-1" 
                            (click)="loadReviews(session.id)">
                            Reviews
                        </button>

                      
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
