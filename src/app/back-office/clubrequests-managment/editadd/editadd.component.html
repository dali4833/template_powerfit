<div class="container mt-4">
    <h2> Add New request</h2>
    
    <div *ngIf="errorMessage" class="alert alert-danger">
        {{ errorMessage }}
    </div>

    <form [formGroup]="requestForm" (ngSubmit)="onSubmit()" class="mt-3">
        <div class="mb-3">
            <label for="name" class="form-label">Name</label>
            <input type="text" 
                   id="name"
                   class="form-control" 
                   formControlName="name"
                   [class.is-invalid]="requestForm.get('name')?.invalid && requestForm.get('name')?.touched">
            <div class="invalid-feedback" *ngIf="requestForm.get('name')?.errors?.['required']">
                Name is required
            </div>
            <div class="invalid-feedback" *ngIf="requestForm.get('name')?.errors?.['minlength']">
                Name must be at least 3 characters
            </div>
        </div>
        
        <div class="mb-3">
            <label for="description" class="form-label">Description</label>
            <textarea id="description"
                      class="form-control" 
                      formControlName="description" 
                      rows="3"
                      [class.is-invalid]="requestForm.get('description')?.invalid && requestForm.get('description')?.touched">
            </textarea>
            <div class="invalid-feedback" *ngIf="requestForm.get('description')?.errors?.['required']">
                Description is required
            </div>
            <div class="invalid-feedback" *ngIf="requestForm.get('description')?.errors?.['minlength']">
                Description must be at least 10 characters
            </div>
        </div>


        <div class="mb-3">
            <label for="capacity" class="form-label">Capacity</label>
            <textarea id="capacity"
                      class="form-control" 
                      formControlName="capacity" 
                      rows="3"
                      [class.is-invalid]="requestForm.get('capacity')?.invalid && requestForm.get('capacity')?.touched">
            </textarea>
            <div class="invalid-feedback" *ngIf="requestForm.get('capacity')?.errors?.['required']">
                capacity is required
            </div>
            
        </div>

        <div class="mt-4">
            <button type="submit" 
                    class="btn btn-primary" 
                    [disabled]="!requestForm.valid || requestForm.pristine">
                {{isEditing ? 'Update' : 'Create'}}
            </button>
            <button type="button" 
                    class="btn btn-secondary ms-2" 
                    routerLink="/admin/clubrequests-management">
                Cancel
            </button>
        </div>
    </form>
</div>
