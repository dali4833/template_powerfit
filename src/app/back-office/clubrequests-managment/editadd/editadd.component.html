<div class="container mt-4">
    <h2>Submit a club creation request</h2>
  
    <div *ngIf="errorMessage" class="alert alert-danger">
      {{ errorMessage }}
    </div>
  
    <form [formGroup]="requestForm" (ngSubmit)="onSubmit()" enctype="multipart/form-data" class="mt-3">
      
      <div class="mb-3">
        <label for="image" class="form-label">Image du club (JPEG/PNG)</label>
        <input type="file" id="image" (change)="onImageChange($event)" class="form-control" accept="image/*">
      </div>
  
      <div class="mb-3">
        <label for="name" class="form-label">Name</label>
        <input type="text" id="name" class="form-control"
               formControlName="name"
               [class.is-invalid]="requestForm.get('name')?.invalid && requestForm.get('name')?.touched">
        <div class="invalid-feedback" *ngIf="requestForm.get('name')?.errors?.['required']">
            Name is required
        </div>
        <div class="invalid-feedback" *ngIf="requestForm.get('name')?.errors?.['minlength']">
            Name must be at least 3 characters
        </div>
      </div>
  
      <div class="mb-3">
        <label for="description" class="form-label">Description</label>
        <textarea id="description" class="form-control" rows="3"
                  formControlName="description"
                  [class.is-invalid]="requestForm.get('description')?.invalid && requestForm.get('description')?.touched"></textarea>
        <div class="invalid-feedback" *ngIf="requestForm.get('description')?.errors?.['required']">
            Description is required
        </div>
        <div class="invalid-feedback" *ngIf="requestForm.get('description')?.errors?.['minlength']">
            Description must be at least 10 characters        </div>
      </div>
  
      <div class="mb-3">
        <label for="capacity" class="form-label">Capacity</label>
        <input type="number" id="capacity" class="form-control"
               formControlName="capacity"
               [class.is-invalid]="requestForm.get('capacity')?.invalid && requestForm.get('capacity')?.touched">
        <div class="invalid-feedback" *ngIf="requestForm.get('capacity')?.errors?.['required']">
            capacity is required
        </div>
      </div>
  
      <div class="mb-3">
        <label for="document" class="form-label"> Officiel Document  (.PDF) *</label>
        <input type="file" id="document" (change)="onFileChange($event)" class="form-control" accept="application/pdf">
      </div>
  
      <div class="mt-4">
        <button type="submit" class="btn btn-primary"
                [disabled]="!requestForm.valid || requestForm.pristine || !documentFile">
          {{ isEditing ? 'Modifier' : 'Créer' }}
        </button>
        <button type="button" class="btn btn-secondary ms-2" routerLink="/admin/clubrequests-management">
          Annuler
        </button>
      </div>
    </form>
  </div>
