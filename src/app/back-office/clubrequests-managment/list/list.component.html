<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>club requests List</h2>
        <button class="btn btn-primary" routerLink="/admin/clubrequests-management/new">Add New club request</button>
    </div>

    <div *ngIf="errorMessage" class="alert alert-danger">
        {{ errorMessage }}
    </div>

    <div *ngIf="loading" class="text-center">
        <div class="spinner-border" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <table class="table mt-3" *ngIf="!loading && requests.length > 0">
        <thead>
            <tr>
                <th>capacity</th>
                <th>description</th>
                <th>name</th>
                <th>status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let req of requests">
                <td>{{req.capacity}}</td>
                <td>{{req.description}}</td>
                <td>{{req.name}}</td>
                <td>{{req.status}}</td>
                <td>
                    <button class="btn btn-sm btn-primary me-2" (click)="approveRequest(req.id!)">Approve</button>
                    <button class="btn btn-sm btn-danger" (click)="req.id && rejectRequest(req.id)">Reject</button>
                  <button class="btn btn-sm btn-secondary me-2" (click)="viewDocument(req.id!)">View Document</button>
                </td>
            </tr>
        </tbody>
    </table>

    <div *ngIf="!loading && requests.length === 0" class="alert alert-info">
        No requests found. Click "Add New request" to create one.
    </div>
</div>
