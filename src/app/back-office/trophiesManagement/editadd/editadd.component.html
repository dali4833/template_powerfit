<div class="container mt-4">
    <div class="form-container">
        <div class="form-header">
            <h2>{{isEditing ? 'Edit' : 'Add New'}} Trophy</h2>
            <button class="btn btn-back" routerLink="/admin/Trophy-management">
                <i class="fas fa-arrow-left"></i> Back to List
            </button>
        </div>

        <div *ngIf="errorMessage" class="alert alert-danger">
            {{ errorMessage }}
        </div>

        <form [formGroup]="trophyForm" (ngSubmit)="onSubmit()" class="trophy-form">
            <div class="form-group">
                <label for="name">Trophy Name</label>
                <input type="text" 
                       id="name"
                       formControlName="name"
                       class="form-control"
                       [class.is-invalid]="trophyForm.get('name')?.invalid && trophyForm.get('name')?.touched">
                <div class="invalid-feedback" *ngIf="trophyForm.get('name')?.errors?.['required']">
                    Name is required
                </div>
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description"
                          formControlName="description"
                          class="form-control"
                          rows="3"
                          [class.is-invalid]="trophyForm.get('description')?.invalid && trophyForm.get('description')?.touched">
                </textarea>
                <div class="invalid-feedback" *ngIf="trophyForm.get('description')?.errors?.['required']">
                    Description is required
                </div>
            </div>

            <div class="form-group">
                <label for="requiredPoints">Required Points</label>
                <input type="number" 
                       id="requiredPoints"
                       formControlName="requiredPoints"
                       class="form-control"
                       [class.is-invalid]="trophyForm.get('requiredPoints')?.invalid && trophyForm.get('requiredPoints')?.touched">
                <div class="invalid-feedback" *ngIf="trophyForm.get('requiredPoints')?.errors?.['required']">
                    Required points is required
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" 
                        class="btn btn-submit" 
                        [disabled]="trophyForm.invalid || loading">
                    <i class="fas" [ngClass]="loading ? 'fa-spinner fa-spin' : 'fa-save'"></i>
                    {{loading ? 'Saving...' : 'Save Trophy'}}
                </button>
            </div>
        </form>
    </div>
</div>
