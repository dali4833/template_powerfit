<div class="container">
    <h2>{{isEditing ? 'Edit' : 'Add'}} Sport</h2>
    
    <form [formGroup]="packForm" (ngSubmit)="onSubmit()">
        <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" class="form-control" formControlName="name">
        </div>
        
        <div class="mb-3">
            <label class="form-label">duration</label>
            <textarea class="form-control" formControlName="duration"></textarea>
        </div>


        <div class="mb-3">
            <label class="form-label">price</label>
            <textarea class="form-control" formControlName="price"></textarea>
        </div>

        <button type="submit" class="btn btn-primary" [disabled]="!packForm.valid">
            {{isEditing ? 'Update' : 'Create'}}
        </button>
        <button type="button" class="btn btn-secondary ms-2" routerLink="/admin/packs-management/">
            Cancel
        </button>
    </form>
</div>
