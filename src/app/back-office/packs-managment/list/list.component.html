<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Packs List</h2>
        <button class="btn btn-primary" routerLink="/admin/packs-management/new">Add New pack</button>
    </div>

    <div *ngIf="errorMessage" class="alert alert-danger">
        {{ errorMessage }}
    </div>

    <div *ngIf="loading" class="text-center">
        <div class="spinner-border" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <table class="table mt-3" *ngIf="!loading && packs.length > 0">
        <thead>
            <tr>
                <th>Name</th>
                <th>duration</th>
                <th>Price</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let pack of packs">
                <td>{{pack.name}}</td>
                <td>{{pack.duration}}</td>
                <td>{{pack.price}}</td>
                <td>
                    <button class="btn btn-sm btn-primary me-2" (click)="editPack(pack.id!)">Edit</button>
                    <button class="btn btn-sm btn-danger me-2" (click)="pack.id && deletePack(pack.id)">Delete</button>
                  <div *ngIf="pack.club; else affectButton">
                    <span class="badge bg-success">Affected to {{ pack.club.name }}</span>
                  </div>
                  <ng-template #affectButton>
                    <button class="btn btn-sm btn-info" (click)="$event.preventDefault(); openAffectModal(pack)">
                      Affect to Club
                    </button>
                  </ng-template>

                </td>
            </tr>
        </tbody>
    </table>

    <!-- Modal -->
    <div class="modal" id="affectModal" tabindex="-1" data-bs-backdrop="static">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Affect Pack to Club</h5>
                    <button type="button" class="btn-close" (click)="closeModal()"></button>
                </div>
                <div class="modal-body">
                    <select class="form-select" [(ngModel)]="selectedClubId">
                        <option value="">Select a club</option>
                        <option *ngFor="let club of clubs" [value]="club.id">{{club.name}}</option>
                    </select>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" (click)="closeModal()">Close</button>
                    <button type="button" class="btn btn-primary" (click)="confirmAffectToClub()"
                            [disabled]="!selectedClubId">Confirm</button>
                </div>
            </div>
        </div>
    </div>

    <div *ngIf="!loading && packs.length === 0" class="alert alert-info">
        No packs found. Click "Add New Pack" to create one.
    </div>
</div>
