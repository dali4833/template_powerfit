<div class="container mt-4">
    <h2>{{isEditing ? 'Edit' : 'Add New'}} club</h2>
    
    <div *ngIf="errorMessage" class="alert alert-danger">
        {{ errorMessage }}
    </div>

    <form [formGroup]="clubform" (ngSubmit)="onSubmit()" class="mt-3">
        <div class="mb-3">
            <div class="mb-3">
                <label for="image" class="form-label">Image</label>
                <input type="file" id="image" class="form-control" (change)="onFileChange($event)">
              </div>              
            <label for="name" class="form-label">Name</label>
            <input type="text" 
                   id="name"
                   class="form-control" 
                   formControlName="name"
                   [class.is-invalid]="clubform.get('name')?.invalid && clubform.get('name')?.touched">
            <div class="invalid-feedback" *ngIf="clubform.get('name')?.errors?.['required']">
                Name is required
            </div>
            <div class="invalid-feedback" *ngIf="clubform.get('name')?.errors?.['minlength']">
                Name must be at least 3 characters
            </div>
        </div>
        
        <div class="mb-3">
            <label for="description" class="form-label">Description</label>
            <textarea id="description"
                      class="form-control" 
                      formControlName="description" 
                      rows="3"
                      [class.is-invalid]="clubform.get('description')?.invalid && clubform.get('description')?.touched">
            </textarea>
            <div class="invalid-feedback" *ngIf="clubform.get('description')?.errors?.['required']">
                Description is required
            </div>
            <div class="invalid-feedback" *ngIf="clubform.get('description')?.errors?.['minlength']">
                Description must be at least 10 characters
            </div>
        </div>





            <div class="mb-3">
            <label for="capacity" class="form-label">capacity</label>
            <textarea id="capacity"
                      class="form-control" 
                      formControlName="capacity" 
                      rows="3"
                      [class.is-invalid]="clubform.get('capacity')?.invalid && clubform.get('capacity')?.touched">
            </textarea>
            <div class="invalid-feedback" *ngIf="clubform.get('capacity')?.errors?.['required']">
                capacity is required
            </div>
        
        </div>

        <div class="mb-3">
            <label for="status" class="form-label">status</label>
            <textarea id="status"
                      class="form-control" 
                      formControlName="status" 
                      rows="3"
                      [class.is-invalid]="clubform.get('status')?.invalid && clubform.get('status')?.touched">
            </textarea>
            <div class="invalid-feedback" *ngIf="clubform.get('status')?.errors?.['required']">
                status is required
            </div>
          
        </div>




        <div class="mt-4">
            <button type="submit" 
                    class="btn btn-primary" 
                    [disabled]="!clubform.valid || clubform.pristine">
                {{isEditing ? 'Update' : 'Create'}}
            </button>
            <button type="button" 
                    class="btn btn-secondary ms-2" 
                    routerLink="/admin/sports-management">
                Cancel
            </button>
        </div>
    </form>
</div>
