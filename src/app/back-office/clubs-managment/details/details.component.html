<div class="container">
    <h2>{{isEditing ? 'Edit' : 'Add'}} Club</h2>
    
    <form [formGroup]="clubForm" (ngSubmit)="onSubmit()">
        <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" class="form-control" formControlName="name">
        </div>
        
        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea class="form-control" formControlName="description"></textarea>
        </div>

    
        <div class="mb-3">
            <label class="form-label">capacity</label>
            <textarea class="form-control" formControlName="capacity"></textarea>
        </div>
        <div class="mb-3">
            <label class="form-label">status</label>
            <textarea class="form-control" formControlName="status"></textarea>
        </div>

        <button type="submit" class="btn btn-primary" [disabled]="!clubForm.valid">
            {{isEditing ? 'Update' : 'Create'}}
        </button>
        <button type="button" class="btn btn-secondary ms-2" routerLink="/admin/clubs-management">
            Cancel
        </button>
    </form>
</div>
