<div class="container-xxl flex-grow-1 container-p-y">
  <div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
      <h5>Product Categories</h5>
      <button type="button" class="btn rounded-pill btn-primary" data-bs-toggle="modal" data-bs-target="#addCategoryModal">Add New Category</button>
    </div>

    <div class="table-responsive text-nowrap">
      <table class="table">
        <thead>
        <tr>
          <th scope="col">Image</th> <!-- New column for image -->
          <th scope="col">Name</th>
          <th scope="col">Description</th>
          <th scope="col">Status</th> <!-- Static Status Column -->
          <th scope="col">Actions</th>
        </tr>
        </thead>
        <tbody class="table-border-bottom-0">
        <tr *ngFor="let category of filteredCategories">
          <td>
            <img *ngIf="category.imageUrl" [src]="category.imageUrl" alt="Category Image" class="img-thumbnail" style="max-height: 50px;">
            <span *ngIf="!category.imageUrl">No image</span>
          </td>
          <td>
            <span>{{ category.name }}</span>
          </td>
          <td>{{ category.description }}</td>
          <td>
            <span class="badge bg-label-primary me-1">Active</span>
          </td>
          <td>
            <div class="dropdown">
              <button type="button" class="btn p-0 dropdown-toggle hide-arrow" data-bs-toggle="dropdown" aria-expanded="false">
                <i class="icon-base bx bx-dots-vertical-rounded"></i>
              </button>
              <div class="dropdown-menu">
                <a class="dropdown-item" (click)="editCategory(category)">
                  <i class="icon-base bx bx-edit-alt me-1"></i> Edit
                </a>
                <a class="dropdown-item" (click)="category.id && deleteCategory(category.id)">
                  <i class="icon-base bx bx-trash me-1"></i> Delete
                </a>
              </div>
            </div>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
<!--/ Basic Bootstrap Table -->

<!-- Add New Category Modal -->
<div class="modal fade" id="addCategoryModal" tabindex="-1" aria-labelledby="addCategoryModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="addCategoryModalLabel">Add New Category</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="addCategoryForm" (ngSubmit)="addCategory($event)" enctype="multipart/form-data">
          <div class="mb-3">
            <label for="categoryName" class="form-label">Name</label>
            <input type="text" [(ngModel)]="category.name" name="name" class="form-control" id="categoryName" placeholder="Enter category name" required>
          </div>
          <div class="mb-3">
            <label for="categoryDescription" class="form-label">Description</label>
            <input type="text" [(ngModel)]="category.description" name="description" class="form-control" id="categoryDescription" placeholder="Enter category description">
          </div>
          <div class="mb-4">
            <label for="imageFile" class="form-label">Upload Image</label>
            <input class="form-control" type="file" id="imageFile" (change)="onFileChange($event)">
          </div>
          <div class="mb-3">
            <div class="form-check">
              <!--                <input class="form-check-input" type="checkbox" [(ngModel)]="category.isActive" name="isActive" id="defaultCheck3" checked>-->
              <!--                <label class="form-check-label" for="defaultCheck3">Active</label>-->
            </div>
          </div>
          <button type="submit" class="btn btn-primary">Add</button>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>
<!-- Edit Category Modal -->
<div class="modal fade" id="editCategoryModal" tabindex="-1" aria-labelledby="editCategoryModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="editCategoryModalLabel">Edit Category</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="editCategoryForm" (ngSubmit)="updateCategory($event)" enctype="multipart/form-data">
          <div class="mb-3">
            <label for="editCategoryName" class="form-label">Name</label>
            <input type="text" [(ngModel)]="category.name" name="name" class="form-control" id="editCategoryName" placeholder="Enter category name" required>
          </div>
          <div class="mb-3">
            <label for="editCategoryDescription" class="form-label">Description</label>
            <input type="text" [(ngModel)]="category.description" name="description" class="form-control" id="editCategoryDescription" placeholder="Enter category description">
          </div>
          <div class="mb-4">
            <label for="editImageFile" class="form-label">Upload New Image (optional)</label>
            <input class="form-control" type="file" id="editImageFile" (change)="onFileChange($event)">
            <div *ngIf="category.imageUrl" class="mt-2">
              <small class="text-muted">Current Image:</small>
              <img [src]="category.imageUrl" alt="Current category image" class="img-thumbnail mt-1" style="max-height: 100px;">
            </div>
          </div>
          <div class="mb-3">
            <div class="form-check">
              <!--                <input class="form-check-input" type="checkbox" [(ngModel)]="category.isActive" name="isActive" id="editDefaultCheck3">-->
              <!--                <label class="form-check-label" for="editDefaultCheck3">Active</label>-->
            </div>
          </div>
          <button type="submit" class="btn btn-primary">Update</button>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>
