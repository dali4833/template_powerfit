<div class="form-container">
    <h2>Update Nutritionist</h2>
  
    <form (ngSubmit)="onUpdate()">
      <div class="form-group">
        <label>Name:</label>
        <input type="text" [(ngModel)]="nutritionist.name" name="name" required />
      </div>
  
      <div class="form-group">
        <label>Email:</label>
        <input type="email" [(ngModel)]="nutritionist.email" name="email" required />
      </div>
  
      <div class="form-group">
        <label>Phone:</label>
        <input type="text" [(ngModel)]="nutritionist.phone" name="phone" required />
      </div>
  
      <div class="form-group">
        <label>Salary:</label>
        <input type="number" [(ngModel)]="nutritionist.salary" name="salary" required />
      </div>
  
      <div class="form-group">
        <label>Hired Date:</label>
        <input type="date" [(ngModel)]="nutritionist.hiredDate" name="hiredDate" required />
      </div>
  
      <div class="form-buttons">
        <button type="submit">Update</button>
        <button type="button" (click)="cancel()">Cancel</button>
      </div>
    </form>
  </div>
