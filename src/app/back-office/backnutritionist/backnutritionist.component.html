<div class="dashboard">
  <div class="card">
    <h4 class="card-title">Meetings Status</h4>
    <div class="chart-wrapper">
      <canvas baseChart
        [data]="pieChartData"
        [type]="'pie'">
      </canvas>
    </div>
  </div>

  <div class="card">
    <h4 class="card-title">General Statistics</h4>
    <div class="chart-wrapper">
      <canvas baseChart
        [data]="barChartData"
        [type]="'bar'">
      </canvas>
    </div>
  </div>
</div>
