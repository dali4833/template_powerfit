<div class="container">
    <h2>{{isEditing ? 'Edit' : 'Add'}} Sport</h2>
    
    <form [formGroup]="sportForm" (ngSubmit)="onSubmit()">
        <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" class="form-control" formControlName="name">
        </div>
        
        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea class="form-control" formControlName="description"></textarea>
        </div>

        <button type="submit" class="btn btn-primary" [disabled]="!sportForm.valid">
            {{isEditing ? 'Update' : 'Create'}}
        </button>
        <button type="button" class="btn btn-secondary ms-2" routerLink="/admin/sports-management">
            Cancel
        </button>
    </form>
</div>
