<div class="container-fluid">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Bookings</h2>
        <button class="btn btn-primary" routerLink="new">New Booking</button>
    </div>

    <div *ngIf="errorMessage" class="alert alert-danger">
        {{ errorMessage }}
    </div>

    <div *ngIf="loading" class="text-center">
        <div class="spinner-border" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <div class="table-responsive">
        <table class="table table-striped" *ngIf="!loading && bookings.length > 0">
            <thead>
                <tr>
                    <th>Status</th>
                    <th>Booked At</th>
                    <th>Resolved At</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let booking of bookings">
                    <td>
                        <span class="badge" [ngClass]="{
                            'bg-warning': booking.status === 'PENDING',
                            'bg-success': booking.status === 'APPROVED',
                            'bg-danger': booking.status === 'REJECTED'
                        }">
                            {{ booking.status }}
                        </span>
                    </td>
                    <td>{{ booking.bookedAt | date:'medium' }}</td>
                    <td>{{ booking.resolvedAt | date:'medium' }}</td>
                    <td>
                        <button *ngIf="booking.status === 'PENDING'"
                                class="btn btn-sm btn-success me-2"
                                (click)="approveBooking(booking.id!)">
                            Approve
                        </button>
                        <button *ngIf="booking.status === 'PENDING'"
                                class="btn btn-sm btn-danger me-2"
                                (click)="rejectBooking(booking.id!)">
                            Reject
                        </button>
                        <button *ngIf="booking.status === 'PENDING'"
                                class="btn btn-sm btn-warning"
                                (click)="cancelBooking(booking.id!)">
                            Cancel
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <div *ngIf="!loading && bookings.length === 0" class="alert alert-info">
        No bookings found. Click "New Booking" to create one.
    </div>
</div>
