<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Sports List</h2>
        <button class="btn btn-primary" routerLink="/admin/sports-management/new">Add New Sport</button>
    </div>

    <div *ngIf="errorMessage" class="alert alert-danger">
        {{ errorMessage }}
    </div>
    
    <div *ngIf="loading" class="text-center">
        <div class="spinner-border" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <table class="table mt-3" *ngIf="!loading && sports.length > 0">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Description</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let sport of sports">
                <td>{{sport.id}}</td>
                <td>{{sport.name}}</td>
                <td>{{sport.description}}</td>
                <td>
                    <button class="btn btn-sm btn-primary me-2" (click)="editSport(sport.id!)">Edit</button>
                    <button class="btn btn-sm btn-danger" (click)="sport.id && deleteSport(sport.id)">Delete</button>
                </td>
            </tr>
        </tbody>
    </table>

    <div *ngIf="!loading && sports.length === 0" class="alert alert-info">
        No sports found. Click "Add New Sport" to create one.
    </div>
</div>
